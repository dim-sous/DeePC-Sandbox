[project]
name = "deepc-sandbox"
version = "0.1.0"
description = "DeePC sandbox — developing, testing, and benchmarking Data-Enabled Predictive Control algorithms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.8.1",
    "numpy>=2.4.2",
    "optuna>=4.8.0",
    "plotly>=6.6.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The code is imported from the repository root (`import run`, `from control.config import …`)
# until the three roots land with an editable install.
pythonpath = ["."]
