[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepc-sandbox"
version = "0.1.0"
description = "DeePC sandbox — developing, testing, and benchmarking Data-Enabled Predictive Control algorithms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "benchlab",             # the bench: records, charts, the command line, the Lab (devkit/README.md)
    "control>=0.10.2",
    "cvxpy>=1.8.1",
    "matplotlib>=3.7",
    "numpy>=2.4.2",
    "optuna>=4.8.0",
    "panel>=1.9.4,<1.10",   # the Lab's page; BESS's Lab runs on 1.9.4
    "param>=2.4.2",
    "plotly>=6.6.0",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
]

[project.scripts]
deepc = "benchlab.cli:main"     # run a piece, save its record (devkit/README.md)
lab = "benchlab.lab:main"       # the Lab: one local page over the pieces (devkit/README.md)

[project.entry-points.benchlab]
# DeePC's declaration to Benchlab: the registry module, beside its COMMAND, TITLE, ROOT, LIBRARIES
project = "harness"

[dependency-groups]
dev = [
    "playwright>=1.63,<1.64",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
# Three roots, one direction, as BESS's: src/ is the controller a real system would run; tools/
# is the simulated world it never sees on hardware; devkit/ is the test bench. All three land on
# sys.path via the editable install, so imports stay flat (`import deepc`, `import plants`,
# `import sim`). The direction src <- tools <- devkit is held by tests/test_roots.py.
where = ["src", "tools", "devkit"]
# Only folders with an __init__.py are packages (BESS, 2026-10-26: a deleted package's leftover
# __pycache__ folder was installed as an empty namespace package).
namespaces = false

[tool.uv.sources]
# Benchlab at a tag, raised by hand, then the whole suite (Benchlab's README)
benchlab = { git = "https://github.com/dim-sous/BenchLab", tag = "v0.2.0" }

[tool.uv]
# The editable install records the package list at install time, so a package added or moved
# under the roots is invisible until a reinstall. These keys make `uv sync` notice one.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/__init__.py" },
    { file = "tools/**/__init__.py" },
    { file = "devkit/**/__init__.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The roots are importable through the editable install; the repository root is on the path for
# `tune.py` (`import tune`) and for `tests`.
pythonpath = ["."]
